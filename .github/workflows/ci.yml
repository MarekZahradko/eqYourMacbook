name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | head -1)"
          swift --version

      - name: Build
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh
